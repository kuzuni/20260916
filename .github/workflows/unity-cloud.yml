name: Unity cloud validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-cloud.yml"

concurrency:
  group: unity-${{ github.ref }}
  # Keep useful compilation/activation evidence while coordinator integrates artwork.
  # GitHub retains only the latest pending run for this PR.
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Compile and PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Validate UI metadata and clear stale evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          invalid = [str(p) for p in Path("Assets/DarkFantasyUI").rglob("*.meta") if not re.search(r"(?m)^guid: [0-9a-f]{32}$", p.read_text(encoding="utf-8"))]
          if invalid:
              raise SystemExit("Invalid Unity GUID: " + ", ".join(invalid))
          artifacts = Path("Artifacts")
          for pattern in ("Runtime-*.png", "Verification.txt", "CloudCapture.log"):
              for path in artifacts.glob(pattern):
                  path.unlink()
          results = artifacts / "TestResults"
          if results.is_dir():
              shutil.rmtree(results)
          PY
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Run Unity tests
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneLinux64
          buildMethod: Moonlit.Editor.CloudTests.Run
          manualExit: true
          enableGpu: true
          allowDirtyBuild: true # Hosted checkout only: stale generated evidence was removed above.
          versioning: Custom
          version: 0.1.0
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            Artifacts/TestResults
            Logs
          if-no-files-found: error
      - name: Upload generated combat assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-runtime-assets
          path: |
            Assets/DarkFantasyUI/Resources/Moonlit/Combat*
            Assets/DarkFantasyUI/Resources/Moonlit/Forge/CelestialThumbnails*
          if-no-files-found: warn

  screenshots:
    name: Graphics runtime captures
    # Both jobs are required evidence; render independently so visual regressions are available with test failures.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Validate UI metadata and clear stale evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          invalid = [str(p) for p in Path("Assets/DarkFantasyUI").rglob("*.meta") if not re.search(r"(?m)^guid: [0-9a-f]{32}$", p.read_text(encoding="utf-8"))]
          if invalid:
              raise SystemExit("Invalid Unity GUID: " + ", ".join(invalid))
          artifacts = Path("Artifacts")
          for pattern in ("Runtime-*.png", "Verification.txt", "CloudCapture.log"):
              for path in artifacts.glob(pattern):
                  path.unlink()
          results = artifacts / "TestResults"
          if results.is_dir():
              shutil.rmtree(results)
          PY
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Activate Unity and capture with graphics enabled
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneLinux64
          buildMethod: Moonlit.Editor.CloudVerification.Run
          manualExit: true
          enableGpu: true
          allowDirtyBuild: true # Hosted checkout only: stale generated evidence was removed above.
          versioning: Custom
          version: 0.1.0
      - name: Upload reports and general captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-evidence-reports
          path: |
            Artifacts/Runtime-*.png
            !Artifacts/Runtime-*9x16*.png
            !Artifacts/Runtime-*9x19*.png
            Artifacts/Verification.txt
            Artifacts/CloudCapture.log
          if-no-files-found: error

      - name: Upload 9 by 16 original captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-evidence-9x16
          path: |
            Artifacts/Runtime-*9x16*.png
            !Artifacts/Runtime-skill-[0-9]*-9x16.png
          if-no-files-found: error
      - name: Upload 9 by 19 original captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-evidence-9x19
          path: |
            Artifacts/Runtime-*9x19*.png
            !Artifacts/Runtime-skill-[0-9]*-9x19.png
          if-no-files-found: error

      - name: Upload 9x16 skill flight and impact captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-evidence-skills-9x16
          path: Artifacts/Runtime-skill-[0-9]*-9x16.png
          if-no-files-found: error

      - name: Upload 9x19 skill flight and impact captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-evidence-skills-9x19
          path: Artifacts/Runtime-skill-[0-9]*-9x19.png
          if-no-files-found: error
