name: Unity cloud validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-cloud.yml"

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Compile and PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.8f1
          testMode: PlayMode
          artifactsPath: Artifacts/TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Moonlit PlayMode tests
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            Artifacts/TestResults
            Logs
          if-no-files-found: warn

  screenshots:
    name: Graphics runtime captures
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Prepare license file without exposing its value
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/unity-home/.local/share/unity3d/Unity"
          printf '%s' "$UNITY_LICENSE" > "$RUNNER_TEMP/unity-home/.local/share/unity3d/Unity/Unity_lic.ulf"
          chmod 600 "$RUNNER_TEMP/unity-home/.local/share/unity3d/Unity/Unity_lic.ulf"
      - name: Capture under a virtual graphics display
        env:
          UNITY_IMAGE: unityci/editor:ubuntu-6000.3.8f1-linux-il2cpp-3
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/home/unity \
            -v "$PWD:/project" \
            -v "$RUNNER_TEMP/unity-home:/home/unity" \
            -w /project "$UNITY_IMAGE" \
            xvfb-run -a unity-editor -batchmode \
              -projectPath /project \
              -logFile /project/Artifacts/CloudCapture.log \
              -executeMethod Moonlit.Editor.CloudVerification.Run
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-runtime-captures
          path: |
            Artifacts/Runtime-*.png
            Artifacts/Verification.txt
            Artifacts/CloudCapture.log
          if-no-files-found: error
