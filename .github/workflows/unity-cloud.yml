name: Unity cloud validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-cloud.yml"

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Compile and PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Run Unity tests
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneLinux64
          buildMethod: Moonlit.Editor.CloudTests.Run
          manualExit: true
          enableGpu: true
          versioning: Custom
          version: 0.1.0
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            Artifacts/TestResults
            Logs
          if-no-files-found: error

  screenshots:
    name: Graphics runtime captures
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner disk for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Require configured Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: test -n "$UNITY_EMAIL" && test -n "$UNITY_LICENSE" && test -n "$UNITY_PASSWORD"
      - name: Activate Unity and capture with graphics enabled
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneLinux64
          buildMethod: Moonlit.Editor.CloudVerification.Run
          manualExit: true
          enableGpu: true
          versioning: Custom
          version: 0.1.0
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-runtime-captures
          path: |
            Artifacts/Runtime-*.png
            Artifacts/Verification.txt
            Artifacts/CloudCapture.log
          if-no-files-found: error
